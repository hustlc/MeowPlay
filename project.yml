name: MeowPlay
options:
  minimumXcodeGenVersion: 2.45.4
  bundleIdPrefix: com.meowplay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MeowPlay:
    type: application
    platform: iOS
    sources:
      - path: MeowPlay
        excludes:
          - Resources/Audio/README.md
          - StoreKit/MeowPlay.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meowplay.app
        PRODUCT_NAME: MeowPlay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MeowPlay
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      storeKitConfiguration: MeowPlay/StoreKit/MeowPlay.storekit
      testTargets:
        - MeowPlayTests
  MeowPlayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MeowPlayTests
      - path: MeowPlay/Resources/SoundCatalog.json
        buildPhase: resources
    dependencies:
      - target: MeowPlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meowplay.tests
        GENERATE_INFOPLIST_FILE: YES
